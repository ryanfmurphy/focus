name: Focus
options:
  bundleIdPrefix: com.ryanfmurphy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team in Xcode (Signing & Capabilities), or add
    # DEVELOPMENT_TEAM: XXXXXXXXXX here.

targets:
  Focus:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanfmurphy.focus
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: FocusWidget
        embed: true

  FocusWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanfmurphy.focus.FocusWidget
        INFOPLIST_FILE: Widget/Info.plist
